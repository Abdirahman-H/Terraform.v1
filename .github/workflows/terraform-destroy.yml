name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm"
        required: true

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: eu-west-2
  TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
  TF_VAR_db_username: ${{ secrets.TF_VAR_db_username }}


jobs:
  terraform-destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/infrastructure
    steps:
      - name: Confirm Destruction
        if: github.event.inputs.confirm != 'DESTROY'
        run: |
          echo "You must type DESTROY to confirm"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.6

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan Destroy
        run: terraform plan -destroy -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: project/infrastructure/tfplan

    
  apply-destroy:
    name: Apply Destroy
    runs-on: ubuntu-latest
    needs: terraform-destroy
    environment: production
    defaults:
      run:
        working-directory: project/infrastructure
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.6

      - name: Terraform Init
        run: terraform init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: project/infrastructure

      - name: Terraform Apply Destroy
        run: terraform apply -destroy -auto-approve tfplan        